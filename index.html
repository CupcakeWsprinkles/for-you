  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 15px;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Fredoka', cursive, sans-serif;
      /* HIER DEIN HINTERGRUND-GIF EINFÜGEN */
      background-image: url('mei mei 🥺.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #ffd6e7; /* Fallback-Farbe, falls Bild noch lädt */
      overflow-x: hidden;
    }

    /* Retro Computer Window Design */
    .window {
      width: 100%;
      max-width: 420px;
      background-color: #fff0f6;
      border: 3px solid #2b2b2b;
      border-radius: 14px;
      box-shadow: 6px 6px 0px #2b2b2b;
      overflow: hidden;
      animation: popIn 0.25s ease-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Obere Fensterleiste */
    .title-bar {
      background-color: #ff85b3;
      border-bottom: 3px solid #2b2b2b;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .window-dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid #2b2b2b;
      background-color: #ffe6f0;
    }

    .window-title {
      font-size: 13px;
      font-weight: 700;
      color: #2b2b2b;
      letter-spacing: 0.5px;
    }

    /* Fensterinhalt */
    .window-body {
      padding: 24px 20px;
      text-align: center;
    }

    .message-text {
      font-size: 22px;
      font-weight: 700;
      color: #2b2b2b;
      line-height: 1.4;
      margin-bottom: 24px;
      word-wrap: break-word;
    }

    /* kleinerer Text für den langen Endtext */
    .message-text.final-text {
      font-size: 17px;
      font-weight: 500;
      text-align: left;
      line-height: 1.5;
    }

    /* Button Container */
    .options-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    /* Umrahmte Kästen (Buttons) */
    .btn {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #2b2b2b;
      background-color: #ffffff;
      border: 3px solid #2b2b2b;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      box-shadow: 3px 3px 0px #2b2b2b;
      transition: transform 0.1s, box-shadow 0.1s, background-color 0.1s;
    }

    .btn:active:not(.disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px #2b2b2b;
    }

    .btn:hover:not(.disabled) {
      background-color: #ffe6f0;
    }

    /* Deaktivierte Buttons (nicht klickbar) */
    .btn.disabled {
      opacity: 0.45;
      cursor: not-allowed;
      background-color: #e0e0e0;
      box-shadow: none;
    }

    /* Spezial-Layout für das GIF in Route 1,21 */
    .gif-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      max-width: 420px;
    }

    .gif-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
    }

    .center-gif {
      max-width: 72%;
      max-height: 60vh;
      border: 3px solid #2b2b2b;
      border-radius: 12px;
      box-shadow: 5px 5px 0px #2b2b2b;
      background: #fff;
    }
  </style>
